<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Beyond Say No — an interactive youth-focused visual communication intervention for drug-risk recognition, misinformation awareness, and help-seeking."
    >

    <meta name="theme-color" content="#120f17">

    <title>Beyond Say No | Interactive Drug-Risk Awareness</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <header class="site-header">

            <button
                id="brandButton"
                class="brand-button"
                type="button"
                aria-label="Go to Beyond Say No home page"
            >

                <span class="brand-symbol" aria-hidden="true">
                    BSN
                </span>

                <span class="brand-name">
                    BEYOND SAY NO
                </span>

            </button>

            <div class="header-right">

                <div
                    id="progressContainer"
                    class="progress-container"
                    aria-label="Intervention progress"
                    hidden
                >

                    <span id="progressLabel" class="progress-label">
                        0 / 9
                    </span>

                    <div class="progress-track" aria-hidden="true">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>

                </div>

                <button
                    id="headerHomeButton"
                    class="header-icon-button"
                    type="button"
                    aria-label="Return to home"
                    title="Home"
                    hidden
                >
                    <span aria-hidden="true">⌂</span>
                </button>

            </div>

        </header>

        <main
            id="app-container"
            tabindex="-1"
            aria-live="polite"
        ></main>

        <footer class="site-footer">

            <p>Beyond Say No</p>
            <p>Interactive educational intervention</p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
