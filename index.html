<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Beyond Say No — an interactive youth-focused visual communication intervention for drug-risk recognition, misinformation awareness, and help-seeking."
    >

    <meta name="theme-color" content="#110e10">

    <title>Beyond Say No | Interactive Drug-Risk Awareness</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Our stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         APP WRAPPER
    ========================================================== -->

    <div id="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="site-header">

            <button
                id="brandButton"
                class="brand-button"
                type="button"
                aria-label="Go to Beyond Say No home page"
            >

                <span class="brand-symbol" aria-hidden="true">
                    BSN
                </span>

                <span class="brand-name">
                    BEYOND SAY NO
                </span>

            </button>


            <div class="header-right">

                <!-- Progress appears during the intervention -->
                <div
                    id="progressContainer"
                    class="progress-container"
                    aria-label="Intervention progress"
                    hidden
                >

                    <span
                        id="progressLabel"
                        class="progress-label"
                    >
                        0 / 9
                    </span>

                    <div
                        class="progress-track"
                        aria-hidden="true"
                    >

                        <div
                            id="progressBar"
                            class="progress-bar"
                        ></div>

                    </div>

                </div>


                <!-- Home button -->
                <button
                    id="headerHomeButton"
                    class="header-icon-button"
                    type="button"
                    aria-label="Return to home"
                    title="Home"
                    hidden
                >
                    <span aria-hidden="true">⌂</span>
                </button>

            </div>

        </header>


        <!-- =====================================================
             MAIN APPLICATION AREA

             JavaScript places every screen inside this element.
        ====================================================== -->

        <main
            id="app-container"
            tabindex="-1"
            aria-live="polite"
        >
        </main>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer class="site-footer">

            <p>
                Beyond Say No
            </p>

            <p>
                Interactive educational intervention
            </p>

        </footer>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="script.js"></script>

</body>
</html>
